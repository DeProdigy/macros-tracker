packages:
  - "apps/*"
  - "packages/*"

# No `nodeLinker` here on purpose, so the default isolated layout stands.
#
# `.npmrc` used to carry `node-linker=hoisted`, citing Expo's monorepo guidance
# that React Native resolves modules more reliably from a flat node_modules.
# pnpm 11 does not read that key from `.npmrc` — `pnpm config get node-linker`
# answers `undefined` — so the workspace has always installed isolated, and the
# comment described behaviour it never had.
#
# Checked rather than assumed before deleting it, on Expo SDK 57: `expo config
# --type introspect` resolves the Sign in with Apple entitlement, and three EAS
# iOS builds succeeded on this layout. Isolated also keeps pnpm's protection
# against phantom dependencies, which hoisting gives up.
#
# If native tooling does break later — E4 adds expo-camera and
# expo-image-manipulator — the fix is `nodeLinker: hoisted` HERE, not in
# `.npmrc`.
allowBuilds:
  # Native module resolver pulled in transitively by the JS toolchain.
  unrs-resolver: true
  # Orval loads orval.config.ts through esbuild, which needs its native binary.
  esbuild: true
  # Analytics-only postinstall pulled in transitively; nothing depends on it.
  '@scarf/scarf': false
minimumReleaseAgeExclude:
  - '@expo/cli@56.1.21'
  - '@expo/config-plugins@56.0.14'
  - '@expo/config@56.0.13'
  - '@expo/fingerprint@0.19.9'
  - '@expo/image-utils@0.10.4'
  - '@expo/metro-config@56.0.18'
  - '@expo/prebuild-config@56.0.21'
  - '@expo/require-utils@56.1.6'
  - '@expo/router-server@56.0.17'
  - babel-preset-expo@56.0.18
  - expo-asset@56.0.21
  - expo-constants@56.0.22
  - expo-modules-autolinking@56.0.21
  - expo-modules-core@56.0.22
  - expo@56.0.17
  - '@expo/metro-runtime@56.0.18'
  - '@expo/ui@56.0.23'
  - expo-linking@56.0.16
  - expo-router@56.2.16
  - expo-splash-screen@56.0.14
  - expo-web-browser@56.0.6
  - expo-dev-client@57.0.14
  - expo-dev-launcher@57.0.14
  - expo-dev-menu@57.0.14
